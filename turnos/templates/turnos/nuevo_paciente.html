{% extends "turnos/base.html" %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h3 class="mb-3">{{ titulo }}</h3>
      <form method="post">
        {% csrf_token %}
        {% for campo in form %}
          <div class="mb-3">
            <label class="form-label fw-semibold">{{ campo.label|capfirst }}</label>
            {{ campo }}
            {% for e in campo.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
          </div>
        {% endfor %}
        <button class="btn btn-primary">Guardar</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
