<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}CMET - Turnos{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f7fb; }
    .navbar { background: #1f4e79; }
    form input:not([type=checkbox]), form select { display:block; width:100%; padding:.4rem .6rem;
      border:1px solid #ced4da; border-radius:.375rem; margin-bottom:.25rem; }
    .helptext { font-size:.85rem; color:#6c757d; }
  </style>
  {% block estilos %}{% endblock %}
</head>
<body>
{% if user.is_authenticated %}
<nav class="navbar navbar-expand navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">CMET · Turnos</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="{% url 'inicio' %}">Agenda</a>
      <a class="nav-link" href="{% url 'dar_turno' %}">Dar turno</a>
      <a class="nav-link" href="{% url 'pacientes' %}">Pacientes</a>
      <a class="nav-link" href="{% url 'profesionales' %}">Profesionales</a>
    </div>
    <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-2">
      {% csrf_token %}
      <span class="text-white-50 small">{{ user.username }}</span>
      <button class="btn btn-sm btn-outline-light">Salir</button>
    </form>
  </div>
</nav>
{% endif %}
<main class="container">
  {% for m in messages %}
    <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %}">{{ m }}</div>
  {% endfor %}
  {% block contenido %}{% endblock %}
</main>
</body>
</html>
